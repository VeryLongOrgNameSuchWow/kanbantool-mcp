name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest -q --cov=src/kanbantool_mcp --cov-report=term-missing --cov-report=json:coverage.json
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage.json ]; then
            pct=$(jq -r '.totals.percent_covered_display' coverage.json)
            {
              echo "## Coverage (Python ${{ matrix.python-version }})"
              echo ""
              echo "**${pct}%** lines covered"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
