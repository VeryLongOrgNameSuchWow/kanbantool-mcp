name: release-please

# Watches conventional-commit messages on ``main`` and opens (or updates) a
# release PR that bumps ``__version__`` in ``src/kanbantool_mcp/__init__.py``
# and prepends an entry to ``CHANGELOG.md``. Merging the release PR triggers
# release-please-action to create the corresponding ``v*`` tag and GitHub
# Release; that tag then fires ``release.yml`` which builds and publishes to
# PyPI.
#
# This means a normal cut is just:
#  1. Land conventional-commit PRs on ``main`` (``feat:`` / ``fix:`` /
#     ``BREAKING CHANGE:`` etc.).
#  2. Wait for release-please to open / refresh the release PR.
#  3. Review and merge it.
#  4. Tag + publish happens automatically.
#
# See https://github.com/googleapis/release-please-action and
# ``RELEASING.md`` for the full flow.
#
# Triggers: ``push: branches: [main]`` is the production flow; the
# ``workflow_dispatch:`` is kept available for manual reruns when debugging
# release-please's parsing or when the auto-trigger needs a one-off bypass.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Mint an installation token from the kanbantool-mcp-release-please
      # GitHub App (App ID + private key in repo secrets) instead of falling
      # through to the workflow's default GITHUB_TOKEN. Tags and PRs created
      # via GITHUB_TOKEN do not fire downstream workflows — that's GitHub's
      # anti-loop rule — which would mean release-please's tag push silently
      # skips ``release.yml`` (PyPI publish + GitHub Release). An App token
      # has no such restriction, so the cut becomes fully hands-off again.
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
