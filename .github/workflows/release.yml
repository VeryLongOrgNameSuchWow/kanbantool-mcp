name: Release

on:
  push:
    tags: ["v*"]
  # Manual dispatch as the escape hatch when a tag was created via
  # ``GITHUB_TOKEN`` (e.g. by release-please-action), which by GitHub's
  # anti-loop rule does NOT fire ``push: tags`` triggers in other
  # workflows. Run from the GitHub Actions UI or via:
  #   gh workflow run release.yml --ref main -f tag=v0.X.Y
  # The ``tag`` input is required because dispatching from a branch ref
  # (rather than a tag) means the workflow has no implicit tag context;
  # the input becomes the checkout target + the GitHub-Release tag name.
  # Long-term fix is to give release-please-action a PAT or GitHub App
  # so its tag pushes count as user pushes.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build + publish (e.g. v0.2.1). Required."
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    # Bind to the ``pypi`` environment so the protection rules around it (tag
    # policy, optional required reviewers) gate the publish step. The PyPI
    # trusted-publisher entry must be configured for environment ``pypi``;
    # see ``Environment name`` on https://pypi.org/manage/account/publishing/.
    environment: pypi
    permissions:
      id-token: write
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # On ``push: tags``, ``github.ref`` is the tag and the default
          # checkout is fine. On ``workflow_dispatch``, ``github.ref`` is
          # the branch we dispatched from (typically main) — pivot to the
          # input ``tag`` so the build artifacts match the right version.
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
      # Sync from ``uv.lock`` (no resolver pass) before building so the wheel
      # that ships to PyPI is built against exactly the dependency set we
      # tested against. Without this, ``uv build`` lets the resolver pick
      # whatever satisfies the loose constraints in ``pyproject.toml`` at
      # tag-push time, which can drift from CI. CI deliberately stays on the
      # unfrozen path — that's how we catch loose-bound regressions before
      # they ship — so ``--frozen`` only goes here.
      - run: uv sync --frozen --no-dev
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247  # v1.14.1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          # On ``push: tags`` softprops resolves the tag from
          # ``github.ref_name`` automatically. On ``workflow_dispatch``,
          # ``github.ref_name`` is the branch we dispatched from, so we
          # have to point softprops at the input tag explicitly.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Release notes are owned by release-please (see release-please.yml
          # + release-please-config.json). It opens the release PR, builds the
          # CHANGELOG entry from conventional commits, and creates the GitHub
          # Release with that body when the PR merges. By the time this tag
          # fires, the release already exists with curated notes — softprops
          # just attaches the build artifacts.
          #
          # If a release is cut manually (emergency hotfix bypassing
          # release-please), softprops will create the release here with no
          # notes; populate via ``gh release edit vX.Y.Z --notes …`` after.
          # Explicit glob — ``dist/*`` would also pick up ``dist/.gitignore``
          # that ``uv build`` writes (a one-line ``*`` to keep ``dist/`` out
          # of source). v0.1.0 shipped that file as a release asset; this
          # change scopes attestations + artifacts only.
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.publish.attestation
      # Auto-close any issues referenced as ``Closes #N`` in the CHANGELOG
      # section for the just-published version. Keeps the issue tracker
      # honest without requiring a manual ``gh issue close`` after every
      # tag. Silent on parse failures — the release is already shipped at
      # this point; no need to fail the workflow if an issue ref is malformed.
      - name: Close issues referenced in CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ``GITHUB_REF`` only carries the tag for the ``push: tags`` path;
          # under ``workflow_dispatch`` it's the dispatching branch ref. Use
          # the same precedence as the checkout step so this works for both.
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          version="${DISPATCH_TAG:-${GITHUB_REF#refs/tags/}}"
          version="${version#v}"
          # Extract the section under ``## [VERSION] - YYYY-MM-DD`` up to the
          # next ``## [`` heading. The brackets are escaped in awk source so
          # the regex engine treats them as literals; passing ``[VERSION]``
          # via a shell variable would be parsed as a character class (the
          # v0.2.0 release shipped with the buggy form and silently produced
          # an empty section).
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]"  { inside=1; next }
            /^## \[/                       { inside=0 }
            inside                         { print }
          ' CHANGELOG.md > /tmp/release-section.md
          if [ ! -s /tmp/release-section.md ]; then
            echo "::notice::No CHANGELOG section found for [$version]; skipping issue close."
            exit 0
          fi
          grep -oiE 'closes #[0-9]+' /tmp/release-section.md \
            | grep -oE '[0-9]+' | sort -u > /tmp/issue-ids.txt
          if [ ! -s /tmp/issue-ids.txt ]; then
            echo "::notice::No 'Closes #N' references in CHANGELOG section for [$version]."
            exit 0
          fi
          while read -r n; do
            gh issue close "$n" \
              --comment "Closed by v${version}: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${version}" \
              || echo "::warning::Failed to close #$n (already closed, missing, or insufficient permissions)."
          done < /tmp/issue-ids.txt
