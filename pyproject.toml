[project]
name = "kanbantool-mcp"
# Version is read from ``src/kanbantool_mcp/__init__.py`` at build time —
# see ``[tool.hatch.version]`` below. Single source: ``__version__`` is the
# only string that needs bumping for a release.
dynamic = ["version"]
description = "MCP server bridging Claude Code with the Kanban Tool API v3."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "riohno", email = "riohno@tutamail.com" },
]
keywords = ["mcp", "kanbantool", "kanban", "claude", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.11",
]

[project.urls]
Homepage = "https://github.com/VeryLongOrgNameSuchWow/kanbantool-mcp"
Issues = "https://github.com/VeryLongOrgNameSuchWow/kanbantool-mcp/issues"

[project.scripts]
kanbantool-mcp = "kanbantool_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-randomly",
    "respx",
    "ruff",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Single source of truth for the package version. Update ``__version__`` in
# ``__init__.py`` to bump; ``project.version`` resolves dynamically at build
# time. See https://hatch.pypa.io/latest/version/.
path = "src/kanbantool_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kanbantool_mcp"]

[tool.hatch.build.targets.sdist]
# CLAUDE.md is internal Claude Code orientation for this repo — useful for
# contributors via git, but not something a PyPI consumer should be inspecting.
exclude = ["CLAUDE.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
# ``.claude/worktrees/`` holds in-flight Claude Code agent checkouts of this
# same repo. Without this exclude, ty traverses those copies and reports
# duplicate-symbol / cross-tree import errors that have nothing to do with
# the working tree. The directory is gitignored and session-local.
exclude = [".claude"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live integration tests hit a real Kanban Tool account — exclude from the
# default run so ``uv run pytest`` stays offline. The ``Live Integration``
# workflow opts in via ``pytest tests/integration/``.
addopts = "--ignore=tests/integration"
asyncio_mode = "auto"
